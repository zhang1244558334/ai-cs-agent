intents:
  price:
    keywords: ["多少钱", "便宜", "优惠", "砍价", "少点", "打折", "价格"]
    patterns: ["\\\\d+元", "能少\\\\d+", "最低.*价格"]
    priority: 2
    description: "买家询问价格、议价、要求折扣（如'多少钱''能便宜吗'）"
  tech:
    keywords: ["参数", "规格", "型号", "适配", "兼容", "内存", "续航"]
    patterns: ["怎么(用|装|设置)", "(保修|售后|维修).*(多久|怎么)"]
    priority: 1
    description: "买家咨询商品参数、性能、兼容性、使用方法（如'续航多久''怎么安装'）"
  logistics:
    keywords: ["发货", "快递", "物流", "什么时候到", "几天到", "改配送时间", "改地址", "配送", "派送", "签收", "什么时候发货", "多久到"]
    priority: 3
    description: "买家询问发货、物流、快递进度、配送修改（如'快递到哪了''几天能到'）"
  after_sale:
    keywords: ["退货", "退款", "换货", "坏了", "破损", "发错", "漏发", "退"]
    patterns: ["我要退", "怎么退", "不想要了"]
    description: "买家提出售后问题：退换货、退款、商品破损/发错/漏发（如'怎么退货''能退款吗'）"
  handover:
    keywords: ["人工", "客服", "转人工", "真人", "投诉"]
    description: "买家**明确**要求转人工客服、找真人处理、正式投诉。闲聊中随意提及'有人''别人'等词不触发此意图"
  no_reply:
    enable: true
