intents:
  price:
    keywords: ["多少钱", "便宜", "砍价", "少点", "贵了", "最低", "能少", "小刀", "大刀"]
    patterns: ["\\\\d+元", "少\\\\d+", "最低.*价格", "还能.*便宜"]
    priority: 2
  tech:
    keywords: ["尺寸", "大小", "颜色", "几成新", "成色", "正品", "真品", "功能", "材质", "型号"]
    patterns: ["怎么(用|测)", "是否.*(正品|真的)"]
    priority: 1
  logistics:
    keywords: ["发货", "快递", "物流", "什么时候到", "几天到", "什么时候发", "多久到", "自提", "包邮", "运费"]
    priority: 3
  after_sale:
    keywords: ["退货", "退款", "换", "坏了", "破损", "有问题", "不符", "退"]
    patterns: ["我要退", "怎么退", "不想要了"]
  handover:
    keywords: ["人工", "客服", "转人工", "真人", "投诉"]
  no_reply:
    enable: true
