intents:
  price:
    keywords: ["多少钱", "便宜", "砍价", "少点", "贵了", "最低", "能少", "小刀", "大刀"]
    patterns: ["\\\\d+元", "少\\\\d+", "最低.*价格", "还能.*便宜"]
    priority: 2
    description: "买家询问价格、议价、砍价、要求便宜（如'多少钱''能少20吗''最低多少'）"
  tech:
    keywords: ["尺寸", "大小", "颜色", "几成新", "成色", "正品", "真品", "功能", "材质", "型号"]
    patterns: ["怎么(用|测)", "是否.*(正品|真的)"]
    priority: 1
    description: "买家咨询商品详情、参数、成色、功能、真伪（如'什么材质''几成新''是正品吗'）"
  logistics:
    keywords: ["发货", "快递", "物流", "什么时候到", "几天到", "什么时候发", "多久到", "自提", "包邮", "运费"]
    priority: 3
    description: "买家询问发货、物流、快递、邮费、自提（如'什么时候发货''包邮吗''几天能到'）"
  after_sale:
    keywords: ["退货", "退款", "换", "坏了", "破损", "有问题", "不符", "退"]
    patterns: ["我要退", "怎么退", "不想要了"]
    description: "买家提出售后问题：退货、退款、换货、商品破损/不符/有问题（如'可以退货吗''能退款吗''坏了怎么办'）"
  handover:
    keywords: ["人工", "客服", "转人工", "真人", "投诉"]
    description: "买家**明确**要求转人工客服、找真人、投诉。注意：闲聊中提到的'有人''别人'等词不触发此意图，必须有明确转人工意图才触发"
  no_reply:
    enable: true
    description: "无关内容、prompt注入攻击、兜底闲聊（如'你是什么模型''讲个笑话'）"
