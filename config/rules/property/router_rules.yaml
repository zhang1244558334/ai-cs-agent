intents:
  fee:
    keywords: ["物业费", "停车费", "水电费", "缴费", "收费标准", "多少钱", "公摊", "欠费", "怎么交", "水费", "电费"]
    patterns: ["\\\\d+元.*月", "怎么.*缴费", "收费.*标准"]
    priority: 1
    description: "缴费咨询：物业费、停车费、水电费、公摊费用相关问题"
  repair:
    keywords: ["报修", "漏水", "坏了", "维修", "停电", "跳闸", "修", "堵了", "不亮", "坏了", "电梯故障"]
    patterns: [".*(漏|坏|停|堵|故障).*", "怎么.*(修|报修)"]
    priority: 2
    description: "报修维修：水管漏水、停电跳闸、设备损坏、电梯故障、门锁等维修请求"
  complain:
    keywords: ["投诉", "举报", "扰民", "噪音", "太吵", "态度差", "不满", "赔偿", "纠纷"]
    patterns: [".*(太吵|扰民|不满意|过分).*"]
    priority: 3
    description: "投诉纠纷：噪音扰民、邻里纠纷、物业人员投诉、服务质量不满"
  notice:
    keywords: ["通知", "公告", "停水", "停电", "停气", "何时", "什么时候", "喷洒农药", "消杀"]
    patterns: [".*(什么时候|何时|哪天|几号).*(停|通知|公告).*"]
    priority: 4
    description: "公告查询：停水停电通知、社区公告、消杀喷洒、活动通知"
  handover:
    keywords: ["人工", "转人工", "真人", "客服电话", "电话多少"]
    description: "要求转人工客服或获取物业电话"
  no_reply:
    enable: true
