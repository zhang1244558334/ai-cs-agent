services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-cs-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - chromadb
    volumes:
      - ./config:/app/config
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: ai-cs-agent-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

volumes:
  chromadb_data:
